title: Commerce Business Review
source: default

queries:
  executive_summary:
    sql: |
      SELECT
        SUM(order_total) AS total_revenue,
        COUNT(*) AS total_orders,
        AVG(order_total) AS average_order_value,
        COUNT(DISTINCT customer_id) AS total_customers
      FROM DBT_ADEBNEY.FCT_ORDERS
    formats:
      total_revenue: currency
      total_orders: compact
      average_order_value: currency_whole
      total_customers: compact

  monthly_sales:
    sql: |
      SELECT
        DATE_TRUNC('month', ordered_at)::DATE AS order_month,
        SUM(order_total) AS revenue,
        COUNT(*) AS orders,
        AVG(order_total) AS average_order_value
      FROM DBT_ADEBNEY.FCT_ORDERS
      GROUP BY 1
      ORDER BY 1
    formats:
      revenue: currency
      orders: compact
      average_order_value: currency_whole

  store_performance:
    sql: |
      SELECT
        s.store_name,
        s.opened_at::DATE AS opened_on,
        SUM(o.order_total) AS revenue,
        COUNT(*) AS orders,
        AVG(o.order_total) AS average_order_value,
        COUNT(DISTINCT o.customer_id) AS customers,
        DATEDIFF('month', MIN(o.ordered_at), MAX(o.ordered_at)) + 1 AS operating_months,
        SUM(o.order_total) / NULLIF(DATEDIFF('month', MIN(o.ordered_at), MAX(o.ordered_at)) + 1, 0) AS average_monthly_revenue
      FROM DBT_ADEBNEY.DIM_STORES s
      JOIN DBT_ADEBNEY.FCT_ORDERS o
        ON s.store_id = o.store_id
      GROUP BY 1, 2
      ORDER BY revenue DESC
    formats:
      revenue: currency
      orders: compact
      average_order_value: currency_whole
      customers: compact
      average_monthly_revenue: currency

  product_mix:
    sql: |
      SELECT
        product_type,
        COUNT(*) AS line_items,
        SUM(product_price) AS product_sales
      FROM DBT_ADEBNEY.FCT_ORDER_ITEMS
      GROUP BY 1
      ORDER BY product_sales DESC
    formats:
      line_items: compact
      product_sales: currency

  top_products:
    sql: |
      SELECT
        product_name,
        product_type,
        COUNT(*) AS line_items,
        SUM(product_price) AS product_sales
      FROM DBT_ADEBNEY.FCT_ORDER_ITEMS
      GROUP BY 1, 2
      ORDER BY product_sales DESC
      LIMIT 10
    formats:
      line_items: compact
      product_sales: currency

  repeat_purchase_segments:
    sql: |
      WITH customer_orders AS (
        SELECT customer_id, COUNT(*) AS orders, SUM(order_total) AS revenue
        FROM DBT_ADEBNEY.FCT_ORDERS
        GROUP BY 1
      )
      SELECT
        CASE
          WHEN orders = 1 THEN 'One order'
          WHEN orders BETWEEN 2 AND 4 THEN '2–4 orders'
          WHEN orders BETWEEN 5 AND 9 THEN '5–9 orders'
          ELSE '10+ orders'
        END AS order_frequency_segment,
        COUNT(*) AS customers,
        SUM(orders) AS orders,
        SUM(revenue) AS revenue
      FROM customer_orders
      GROUP BY 1
      ORDER BY CASE order_frequency_segment
        WHEN 'One order' THEN 1
        WHEN '2–4 orders' THEN 2
        WHEN '5–9 orders' THEN 3
        ELSE 4
      END
    formats:
      customers: compact
      orders: compact
      revenue: currency

  seasonality:
    sql: |
      SELECT
        EXTRACT(month FROM ordered_at) AS calendar_month,
        SUM(order_total) AS revenue,
        COUNT(*) AS orders,
        AVG(order_total) AS average_order_value
      FROM DBT_ADEBNEY.FCT_ORDERS
      GROUP BY 1
      ORDER BY 1
    formats:
      revenue: currency
      orders: compact
      average_order_value: currency_whole

charts:
  total_revenue:
    query: executive_summary
    type: kpi
    value: total_revenue
    label: Total revenue
    style:
      value:
        format: currency

  total_orders:
    query: executive_summary
    type: kpi
    value: total_orders
    label: Orders
    style:
      value:
        format: compact

  average_order_value:
    query: executive_summary
    type: kpi
    value: average_order_value
    label: Average order value
    style:
      value:
        format: currency_whole

  total_customers:
    query: executive_summary
    type: kpi
    value: total_customers
    label: Customers
    style:
      value:
        format: compact

  monthly_revenue:
    query: monthly_sales
    type: line
    title: 1. Business trajectory — monthly revenue
    subtitle: Revenue has risen materially across the full history; use this as the top-level health trend.
    x: order_month
    y: revenue
    style:
      axis_y:
        labels:
          format: currency

  revenue_by_store:
    query: store_performance
    type: bar
    title: 2. Growth engines — lifetime revenue by store
    subtitle: Compare alongside average monthly revenue because stores have different operating histories.
    x: store_name
    y: revenue
    style:
      axis_y:
        labels:
          format: currency

  store_scorecard:
    query: store_performance
    type: table
    title: Store comparison — normalize for operating time
    style:
      columns:
        opened_on:
          label: Opened
        revenue:
          label: Lifetime revenue
          format: currency
          align: right
        average_monthly_revenue:
          label: Avg. monthly revenue
          format: currency
          align: right
        orders:
          label: Orders
          format: compact
          align: right
        customers:
          label: Customers
          format: compact
          align: right
        average_order_value:
          label: Average order value
          format: currency_whole
          align: right
        operating_months:
          label: Operating months
          format: compact
          align: right

  product_sales_mix:
    query: product_mix
    type: pie
    title: 3. Product strategy — sales mix by category
    theta: product_sales
    color: product_type
    total:
      label: Product sales
    style:
      inner_radius: 0.6
      total:
        value:
          format: currency

  top_products_table:
    query: top_products
    type: table
    title: Product ranking — sales and demand
    style:
      columns:
        line_items:
          label: Line items
          format: compact
          align: right
        product_sales:
          label: Product sales
          format: currency
          align: right

  customer_loyalty:
    query: repeat_purchase_segments
    type: bar
    title: 4. Customer loyalty — revenue by order frequency
    subtitle: Revenue concentration in repeat purchasers indicates the importance of retention.
    x: order_frequency_segment
    y: revenue
    style:
      axis_y:
        labels:
          format: currency

  seasonal_revenue:
    query: seasonality
    type: bar
    title: 5. Planning signal — revenue by calendar month
    subtitle: Historical seasonal pattern across all years; use it to inform staffing and inventory planning.
    x: calendar_month
    y: revenue
    style:
      orientation: vertical
      axis_y:
        labels:
          format: currency

rows:
  - cols: [total_revenue, total_orders, average_order_value, total_customers]
  - monthly_revenue
  - revenue_by_store
  - store_scorecard
  - cols: [product_sales_mix, top_products_table]
  - customer_loyalty
  - seasonal_revenue
