tabs:
  id: commerce_view
  position: top
  default: executive-overview
  items:
    - title: Executive Overview
      notes: Sales health, customer scale, product mix, and customer concentration.
      rows:
        - cols: [executive_total_revenue, executive_total_orders, executive_average_order_value, executive_total_customers]
        - executive_monthly_revenue
        - cols: [executive_revenue_by_store, executive_product_sales_mix]
        - executive_top_customers
    - id: store-performance
      title: Store Performance & Expansion
      notes: Location-level trends and like-for-like context across different store ages.
      rows:
        - cols: [store_total_revenue, store_total_orders, store_average_order_value, store_active_stores]
        - store_revenue_trend
        - store_revenue_last_12_months
        - store_scorecard
    - id: business-review
      title: Commerce Business Review
      notes: An executive narrative from business trajectory through operating actions.
      rows:
        - cols: [review_total_revenue, review_total_orders, review_average_order_value, review_total_customers]
        - review_monthly_revenue
        - review_revenue_by_store
        - review_store_scorecard
        - cols: [review_product_sales_mix, review_top_products]
        - review_customer_loyalty
        - review_seasonal_revenue
