title: Commerce Dashboard Hub
source: default

queries:
  executive_headline_metrics:
    sql: |
      SELECT
        SUM(order_total) AS total_revenue,
        COUNT(*) AS total_orders,
        AVG(order_total) AS average_order_value,
        COUNT(DISTINCT customer_id) AS total_customers
      FROM DBT_ADEBNEY.FCT_ORDERS
    formats:
      total_revenue: currency
      total_orders: compact
      average_order_value: currency_whole
      total_customers: compact

  executive_monthly_sales:
    sql: |
      SELECT
        DATE_TRUNC('month', ordered_at)::DATE AS order_month,
        SUM(order_total) AS revenue,
        COUNT(*) AS orders,
        AVG(order_total) AS average_order_value
      FROM DBT_ADEBNEY.FCT_ORDERS
      GROUP BY 1
      ORDER BY 1
    formats:
      revenue: currency
      orders: compact
      average_order_value: currency_whole

  executive_sales_by_store:
    sql: |
      SELECT
        s.store_name,
        SUM(o.order_total) AS revenue,
        COUNT(*) AS orders,
        AVG(o.order_total) AS average_order_value
      FROM DBT_ADEBNEY.FCT_ORDERS o
      JOIN DBT_ADEBNEY.DIM_STORES s ON o.store_id = s.store_id
      GROUP BY 1
      ORDER BY revenue DESC
    formats:
      revenue: currency
      orders: compact
      average_order_value: currency_whole

  executive_product_mix:
    sql: |
      SELECT
        product_type,
        COUNT(*) AS line_items,
        SUM(product_price) AS product_sales
      FROM DBT_ADEBNEY.FCT_ORDER_ITEMS
      GROUP BY 1
      ORDER BY product_sales DESC
    formats:
      line_items: compact
      product_sales: currency

  executive_top_customers:
    sql: |
      SELECT
        c.customer_name,
        COUNT(*) AS orders,
        SUM(o.order_total) AS revenue,
        AVG(o.order_total) AS average_order_value
      FROM DBT_ADEBNEY.FCT_ORDERS o
      JOIN DBT_ADEBNEY.DIM_CUSTOMERS c ON o.customer_id = c.customer_id
      GROUP BY 1
      ORDER BY revenue DESC
      LIMIT 10
    formats:
      orders: compact
      revenue: currency
      average_order_value: currency_whole

  store_network_summary:
    sql: |
      SELECT
        SUM(order_total) AS total_revenue,
        COUNT(*) AS total_orders,
        AVG(order_total) AS average_order_value,
        COUNT(DISTINCT store_id) AS active_stores
      FROM DBT_ADEBNEY.FCT_ORDERS
    formats:
      total_revenue: currency
      total_orders: compact
      average_order_value: currency_whole
      active_stores: compact

  store_monthly_performance:
    sql: |
      SELECT
        DATE_TRUNC('month', o.ordered_at)::DATE AS order_month,
        s.store_name,
        SUM(o.order_total) AS revenue,
        COUNT(*) AS orders,
        AVG(o.order_total) AS average_order_value
      FROM DBT_ADEBNEY.FCT_ORDERS o
      JOIN DBT_ADEBNEY.DIM_STORES s ON o.store_id = s.store_id
      GROUP BY 1, 2
      ORDER BY 1, 2
    formats:
      revenue: currency
      orders: compact
      average_order_value: currency_whole

  store_lifetime_performance:
    sql: |
      SELECT
        s.store_name,
        s.opened_at::DATE AS opened_on,
        SUM(o.order_total) AS revenue,
        COUNT(*) AS orders,
        COUNT(DISTINCT o.customer_id) AS customers,
        AVG(o.order_total) AS average_order_value,
        DATEDIFF('month', MIN(o.ordered_at), MAX(o.ordered_at)) + 1 AS operating_months,
        SUM(o.order_total) / NULLIF(DATEDIFF('month', MIN(o.ordered_at), MAX(o.ordered_at)) + 1, 0) AS average_monthly_revenue
      FROM DBT_ADEBNEY.DIM_STORES s
      JOIN DBT_ADEBNEY.FCT_ORDERS o ON s.store_id = o.store_id
      GROUP BY 1, 2
      ORDER BY revenue DESC
    formats:
      revenue: currency
      orders: compact
      customers: compact
      average_order_value: currency_whole
      average_monthly_revenue: currency

  store_recent_performance:
    sql: |
      WITH latest_month AS (
        SELECT DATE_TRUNC('month', MAX(ordered_at)) AS month_start
        FROM DBT_ADEBNEY.FCT_ORDERS
      )
      SELECT
        s.store_name,
        SUM(o.order_total) AS revenue_last_12_months,
        COUNT(*) AS orders_last_12_months,
        AVG(o.order_total) AS average_order_value,
        COUNT(DISTINCT o.customer_id) AS customers
      FROM DBT_ADEBNEY.FCT_ORDERS o
      JOIN DBT_ADEBNEY.DIM_STORES s ON o.store_id = s.store_id
      CROSS JOIN latest_month lm
      WHERE o.ordered_at >= DATEADD('month', -11, lm.month_start)
        AND o.ordered_at < DATEADD('month', 1, lm.month_start)
      GROUP BY 1
      ORDER BY revenue_last_12_months DESC
    formats:
      revenue_last_12_months: currency
      orders_last_12_months: compact
      average_order_value: currency_whole
      customers: compact

  review_repeat_purchase_segments:
    sql: |
      WITH customer_orders AS (
        SELECT customer_id, COUNT(*) AS orders, SUM(order_total) AS revenue
        FROM DBT_ADEBNEY.FCT_ORDERS
        GROUP BY 1
      )
      SELECT
        CASE
          WHEN orders = 1 THEN 'One order'
          WHEN orders BETWEEN 2 AND 4 THEN '2–4 orders'
          WHEN orders BETWEEN 5 AND 9 THEN '5–9 orders'
          ELSE '10+ orders'
        END AS order_frequency_segment,
        COUNT(*) AS customers,
        SUM(orders) AS orders,
        SUM(revenue) AS revenue
      FROM customer_orders
      GROUP BY 1
      ORDER BY CASE order_frequency_segment
        WHEN 'One order' THEN 1
        WHEN '2–4 orders' THEN 2
        WHEN '5–9 orders' THEN 3
        ELSE 4
      END
    formats:
      customers: compact
      orders: compact
      revenue: currency

  review_top_products:
    sql: |
      SELECT
        product_name,
        product_type,
        COUNT(*) AS line_items,
        SUM(product_price) AS product_sales
      FROM DBT_ADEBNEY.FCT_ORDER_ITEMS
      GROUP BY 1, 2
      ORDER BY product_sales DESC
      LIMIT 10
    formats:
      line_items: compact
      product_sales: currency

  review_seasonality:
    sql: |
      SELECT
        EXTRACT(month FROM ordered_at) AS calendar_month,
        SUM(order_total) AS revenue,
        COUNT(*) AS orders,
        AVG(order_total) AS average_order_value
      FROM DBT_ADEBNEY.FCT_ORDERS
      GROUP BY 1
      ORDER BY 1
    formats:
      revenue: currency
      orders: compact
      average_order_value: currency_whole

charts:
