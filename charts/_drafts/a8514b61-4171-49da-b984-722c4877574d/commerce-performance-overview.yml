title: Commerce Performance Overview
source: default

queries:
  headline_metrics:
    sql: |
      SELECT
        SUM(order_total) AS total_revenue,
        COUNT(*) AS total_orders,
        AVG(order_total) AS average_order_value,
        COUNT(DISTINCT customer_id) AS total_customers
      FROM DBT_ADEBNEY.FCT_ORDERS
    formats:
      total_revenue: currency
      total_orders: compact
      average_order_value: currency_whole
      total_customers: compact
  monthly_sales:
    sql: |
      SELECT
        DATE_TRUNC('month', ordered_at)::DATE AS order_month,
        SUM(order_total) AS revenue,
        COUNT(*) AS orders,
        AVG(order_total) AS average_order_value
      FROM DBT_ADEBNEY.FCT_ORDERS
      GROUP BY 1
      ORDER BY 1
    formats:
      revenue: currency
      orders: compact
      average_order_value: currency_whole
  sales_by_store:
    sql: |
      SELECT
        s.store_name,
        SUM(o.order_total) AS revenue,
        COUNT(*) AS orders,
        AVG(o.order_total) AS average_order_value
      FROM DBT_ADEBNEY.FCT_ORDERS o
      JOIN DBT_ADEBNEY.DIM_STORES s
        ON o.store_id = s.store_id
      GROUP BY 1
      ORDER BY revenue DESC
    formats:
      revenue: currency
      orders: compact
      average_order_value: currency_whole
  sales_by_product_type:
    sql: |
      SELECT
        product_type,
        COUNT(*) AS line_items,
        SUM(product_price) AS product_sales
      FROM DBT_ADEBNEY.FCT_ORDER_ITEMS
      GROUP BY 1
      ORDER BY product_sales DESC
    formats:
      line_items: compact
      product_sales: currency
  top_customers:
    sql: |
      SELECT
        c.customer_name,
        COUNT(*) AS orders,
        SUM(o.order_total) AS revenue,
        AVG(o.order_total) AS average_order_value
      FROM DBT_ADEBNEY.FCT_ORDERS o
      JOIN DBT_ADEBNEY.DIM_CUSTOMERS c
        ON o.customer_id = c.customer_id
      GROUP BY 1
      ORDER BY revenue DESC
      LIMIT 10
    formats:
      orders: compact
      revenue: currency
      average_order_value: currency_whole

charts:
  total_revenue:
    query: headline_metrics
    type: kpi
    value: total_revenue
    label: Total revenue
    style:
      value:
        format: currency
  total_orders:
    query: headline_metrics
    type: kpi
    value: total_orders
    label: Orders
    style:
      value:
        format: compact
  average_order_value:
    query: headline_metrics
    type: kpi
    value: average_order_value
    label: Average order value
    style:
      value:
        format: currency_whole
  total_customers:
    query: headline_metrics
    type: kpi
    value: total_customers
    label: Customers
    style:
      value:
        format: compact
  monthly_revenue:
    query: monthly_sales
    type: line
    title: Monthly revenue
    x: order_month
    y: revenue
    style:
      axis_y:
        labels:
          format: currency
  revenue_by_store:
    query: sales_by_store
    type: bar
    title: Revenue by store
    x: store_name
    y: revenue
    style:
      axis_y:
        labels:
          format: currency
  product_sales_mix:
    query: sales_by_product_type
    type: pie
    title: Product sales mix
    theta: product_sales
    color: product_type
    total:
      label: Product sales
    style:
      inner_radius: 0.6
      total:
        value:
          format: currency
  top_customers_table:
    query: top_customers
    type: table
    title: Top customers by revenue
    style:
      columns:
        orders:
          label: Orders
          format: compact
          align: right
        revenue:
          label: Revenue
          format: currency
          align: right
        average_order_value:
          label: Average order value
          format: currency_whole
          align: right

rows:
  - cols: [total_revenue, total_orders, average_order_value, total_customers]
  - monthly_revenue
  - cols: [revenue_by_store, product_sales_mix]
  - top_customers_table