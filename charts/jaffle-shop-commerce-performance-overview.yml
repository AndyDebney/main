title: Store Performance & Expansion
source: default

queries:
  network_summary:
    sql: |
      SELECT
        SUM(order_total) AS total_revenue,
        COUNT(*) AS total_orders,
        AVG(order_total) AS average_order_value,
        COUNT(DISTINCT store_id) AS active_stores
      FROM DBT_ADEBNEY.FCT_ORDERS
    formats:
      total_revenue: currency
      total_orders: compact
      average_order_value: currency_whole
      active_stores: compact

  monthly_store_performance:
    sql: |
      SELECT
        DATE_TRUNC('month', o.ordered_at)::DATE AS order_month,
        s.store_name,
        SUM(o.order_total) AS revenue,
        COUNT(*) AS orders,
        AVG(o.order_total) AS average_order_value
      FROM DBT_ADEBNEY.FCT_ORDERS o
      JOIN DBT_ADEBNEY.DIM_STORES s
        ON o.store_id = s.store_id
      GROUP BY 1, 2
      ORDER BY 1, 2
    formats:
      revenue: currency
      orders: compact
      average_order_value: currency_whole

  store_lifetime_performance:
    sql: |
      SELECT
        s.store_name,
        s.opened_at::DATE AS opened_on,
        SUM(o.order_total) AS revenue,
        COUNT(*) AS orders,
        COUNT(DISTINCT o.customer_id) AS customers,
        AVG(o.order_total) AS average_order_value,
        DATEDIFF('month', MIN(o.ordered_at), MAX(o.ordered_at)) + 1 AS operating_months,
        SUM(o.order_total) / NULLIF(DATEDIFF('month', MIN(o.ordered_at), MAX(o.ordered_at)) + 1, 0) AS average_monthly_revenue
      FROM DBT_ADEBNEY.DIM_STORES s
      JOIN DBT_ADEBNEY.FCT_ORDERS o
        ON s.store_id = o.store_id
      GROUP BY 1, 2
      ORDER BY revenue DESC
    formats:
      revenue: currency
      orders: compact
      customers: compact
      average_order_value: currency_whole
      average_monthly_revenue: currency

  recent_store_performance:
    sql: |
      WITH latest_month AS (
        SELECT DATE_TRUNC('month', MAX(ordered_at)) AS month_start
        FROM DBT_ADEBNEY.FCT_ORDERS
      )
      SELECT
        s.store_name,
        SUM(o.order_total) AS revenue_last_12_months,
        COUNT(*) AS orders_last_12_months,
        AVG(o.order_total) AS average_order_value,
        COUNT(DISTINCT o.customer_id) AS customers
      FROM DBT_ADEBNEY.FCT_ORDERS o
      JOIN DBT_ADEBNEY.DIM_STORES s
        ON o.store_id = s.store_id
      CROSS JOIN latest_month lm
      WHERE o.ordered_at >= DATEADD('month', -11, lm.month_start)
        AND o.ordered_at < DATEADD('month', 1, lm.month_start)
      GROUP BY 1
      ORDER BY revenue_last_12_months DESC
    formats:
      revenue_last_12_months: currency
      orders_last_12_months: compact
      average_order_value: currency_whole
      customers: compact

charts:
  total_revenue:
    query: network_summary
    type: kpi
    value: total_revenue
    label: Total revenue
    style:
      value:
        format: currency

  total_orders:
    query: network_summary
    type: kpi
    value: total_orders
    label: Orders
    style:
      value:
        format: compact

  average_order_value:
    query: network_summary
    type: kpi
    value: average_order_value
    label: Average order value
    style:
      value:
        format: currency_whole

  active_stores:
    query: network_summary
    type: kpi
    value: active_stores
    label: Stores
    style:
      value:
        format: compact

  revenue_trend_by_store:
    query: monthly_store_performance
    type: line
    title: Monthly revenue by store
    x: order_month
    y: revenue
    color: store_name
    style:
      axis_y:
        labels:
          format: currency

  revenue_last_12_months:
    query: recent_store_performance
    type: bar
    title: Revenue by store — last 12 months
    x: store_name
    y: revenue_last_12_months
    style:
      axis_y:
        labels:
          format: currency

  store_scorecard:
    query: store_lifetime_performance
    type: table
    title: Store scorecard
    style:
      columns:
        opened_on:
          label: Opened
        revenue:
          label: Lifetime revenue
          format: currency
          align: right
        average_monthly_revenue:
          label: Avg. monthly revenue
          format: currency
          align: right
        orders:
          label: Orders
          format: compact
          align: right
        customers:
          label: Customers
          format: compact
          align: right
        average_order_value:
          label: Average order value
          format: currency_whole
          align: right
        operating_months:
          label: Operating months
          format: compact
          align: right

rows:
  - cols: [total_revenue, total_orders, average_order_value, active_stores]
  - revenue_trend_by_store
  - revenue_last_12_months
  - store_scorecard